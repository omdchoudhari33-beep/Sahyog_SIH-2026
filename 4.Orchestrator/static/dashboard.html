<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAHYOG - Operator Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b3d66'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header class="top">
  <div style="max-width: 1080px;">
    <div class="brand">
      <div class="brand-mark">🗂️</div>
      <div>
        <h1>DNO Validation Queue</h1>
        <div class="tag">Active tickets, ordered by G1 priority score</div>
      </div>
    </div>
    <nav><a href="/admin">Admin portal</a></nav>
  </div>
</header>

<div class="wrap" style="max-width: 1080px;">
  <div id="error" class="error-box"></div>

  <div class="card">
    <div class="toolbar">
      <div class="field" style="margin: 0; flex: 1; min-width: 180px;">
        <label for="operator-id">Operator ID</label>
        <input type="text" id="operator-id" placeholder="e.g. operator-1" />
      </div>
      <button id="refresh-btn">↻ Refresh</button>
    </div>

    <div id="table-wrap" style="overflow-x: auto;">
      <table class="tickets">
        <thead>
          <tr>
            <th>#</th>
            <th>Evidence</th>
            <th>Problem</th>
            <th>Domain</th>
            <th>Severity</th>
            <th>Priority</th>
            <th>Reports</th>
            <th>Suggested track</th>
            <th>Decision</th>
          </tr>
        </thead>
        <tbody id="tickets-body"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none;">
        <span class="empty-icon">📭</span>
        No active tickets right now.
      </div>
    </div>
  </div>

</div>

<footer class="note">Decisions are logged with your operator ID for audit.</footer>

<script src="/static/dashboard.js"></script>
</body>
</html>
