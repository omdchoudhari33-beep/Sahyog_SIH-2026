name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

          while IFS= read -r project_dir; do
            if [ -f "$project_dir/requirements.txt" ]; then
              echo "Installing requirements from $project_dir"
              python -m pip install -r "$project_dir/requirements.txt"
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -type d | sort)

      - name: Lint with flake8
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        shell: bash
        run: |
          while IFS= read -r project_dir; do
            if [ -f "$project_dir/requirements.txt" ] && [ -d "$project_dir/tests" ]; then
              echo "Running pytest for $project_dir"
              (cd "$project_dir" && python -m pytest --import-mode=importlib)
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -type d | sort)
